worker_processes auto;
error_log /tmp/nginx/error.log warn;
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    include /tmp/nginx/resolvers.conf;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # Variables force runtime DNS resolution (starts even if a backend is down).

        # set must run before rewrite ... break (break skips later rewrite-module dirs).
        location /api/cash/ {
            # FQDN: nginx resolver ignores /etc/resolv.conf search domains.
            set $cash_upstream cash-manager-be.control-panel.svc.cluster.local:8080;
            rewrite ^/api/cash/(.*)$ /$1 break;
            proxy_pass http://$cash_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/weight/ {
            set $weight_upstream weight-record-be.control-panel.svc.cluster.local:8080;
            rewrite ^/api/weight/(.*)$ /$1 break;
            proxy_pass http://$weight_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/news/ {
            set $news_upstream news-collector-be.control-panel.svc.cluster.local:8080;
            rewrite ^/api/news/(.*)$ /$1 break;
            proxy_pass http://$news_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
