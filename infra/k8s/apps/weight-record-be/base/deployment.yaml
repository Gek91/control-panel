apiVersion: apps/v1
kind: Deployment
metadata:
  name: weight-record-be
  labels:
    app.kubernetes.io/name: weight-record-be
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: control-panel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weight-record-be
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weight-record-be
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: control-panel
    spec:
      containers:
        - name: weight-record-be
          image: weight-record-api:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: weight-record-be
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
