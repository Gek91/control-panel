apiVersion: apps/v1
kind: Deployment
metadata:
  name: cash-manager-be
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: cash-manager-be
          # Image is built locally and loaded into minikube (`minikube image load`).
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
