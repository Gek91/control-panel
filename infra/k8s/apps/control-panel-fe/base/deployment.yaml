apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-panel-fe
  labels:
    app.kubernetes.io/name: control-panel-fe
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: control-panel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-panel-fe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-panel-fe
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: control-panel
    spec:
      containers:
        - name: control-panel-fe
          image: control-panel-fe:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
